<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - myCloud</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Reset Your Password</h2>
        <p style="color: #555; margin-bottom: 20px;">Enter your email address and we will send you a link to reset your password.</p>
        <form action="{{ url_for('forgot_password') }}" method="post">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>
        <p>Remember your password? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</body>
</html>
