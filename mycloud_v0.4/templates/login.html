<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - myCloud</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="{{ url_for('static', filename='theme.js', v='3') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css', v='3') }}">
</head>
<body>
    <div class="login-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="messages">
            {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <h2>Login to myCloud</h2>
        <form action="{{ url_for('login') }}" method="post">
            <div class="password-wrapper">
                <input type="text" name="username" placeholder="Username or Email" required>
            </div>
            <div class="password-wrapper">
                <input type="password" name="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-password"></i>
            </div>
            <button type="submit">Login</button>
        </form>
        <a href="{{ url_for('google_login') }}" class="google-btn">Login with Google</a>
        <a href="{{ url_for('github_login') }}" class="github-btn">Login with GitHub</a>
        <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
    </div>

    <script>
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function () {
                const passwordInput = this.previousElementSibling;
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>
</html>
