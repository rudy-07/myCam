<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth Claymorphic Camera Body Gradient (Purple to Magenta) -->
    <linearGradient id="bodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="35%" stop-color="#A21CAF" />
      <stop offset="70%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Top Viewfinder / Flash bump gradient -->
    <linearGradient id="bumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Outer Lens Ring (Matte Dark Titanium) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Deep Optical Glass Radial Reflection -->
    <radialGradient id="lensGlass" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#0284C7" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#1E3A8A" />
      <stop offset="90%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Inner Core Pupil Radial -->
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="50%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Specular Highlight Linear Gradient -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Ambient Ground Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#581C87" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Lens Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="256" cy="460" rx="160" ry="26" fill="url(#groundShadow)" />

  <!-- Top Center Bump (Viewfinder / Mount) -->
  <path d="M 180 180 C 180 120, 210 110, 256 110 C 302 110, 332 120, 332 180 Z" fill="url(#bumpGrad)" />

  <!-- Main Camera Body (Pillowy Rounded Squircle) -->
  <rect x="96" y="150" width="320" height="270" rx="72" ry="72" fill="url(#bodyGrad)" />

  <!-- Outer Dark Bezel / Lens Housing -->
  <circle cx="256" cy="285" r="102" fill="url(#ringGrad)" />
  <circle cx="256" cy="285" r="95" fill="#0B0F19" />
  <circle cx="256" cy="285" r="88" fill="url(#ringGrad)" />

  <!-- Optical Glass Element -->
  <circle cx="256" cy="285" r="80" fill="url(#lensGlass)" />

  <!-- Concentric Inner Optics -->
  <circle cx="256" cy="285" r="54" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.6" />
  <circle cx="256" cy="285" r="42" fill="url(#lensCore)" />
  <circle cx="256" cy="285" r="24" fill="#020617" />
  <circle cx="256" cy="285" r="12" fill="#0F172A" />

  <!-- Specular Glass Highlight Arc -->
  <path d="M 200 240 C 220 215, 270 215, 298 232 C 275 224, 230 228, 200 240 Z" fill="url(#specularGrad)" />

  <!-- Green Recording Status LED Indicator -->
  <circle cx="338" cy="214" r="7" fill="#22C55E" filter="url(#softGlow)" />
  <circle cx="338" cy="214" r="3" fill="#DCFCE7" />
</svg>
